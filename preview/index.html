<!doctype html>
<html lang="pl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deye EMS — podgląd interfejsu</title>
<style>
  :root {color-scheme:light;--primary-background-color:#fafafa;--secondary-background-color:#e5e5e5;--card-background-color:#ffffff;--primary-text-color:#212121;--secondary-text-color:#727272;--divider-color:#e0e0e0;--primary-color:#03a9f4;--warning-color:#ffa600;--error-color:#db4437}
  body {margin:0;background:var(--primary-background-color);font:15px system-ui;color:var(--primary-text-color)}
  .demo {padding:12px 24px;background:var(--secondary-background-color);border-bottom:1px solid var(--divider-color);color:var(--primary-text-color);text-align:center;line-height:1.5}
  .demo-controls{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}.demo label {display:block;margin-top:8px;font-size:12px}.demo select {padding:6px 10px;background:var(--card-background-color);color:var(--primary-text-color);border:1px solid var(--divider-color);border-radius:8px}
</style>
<div class="demo"><strong>Podgląd na danych syntetycznych.</strong> Przyciski symulują działanie. Strona nie łączy się z Home Assistant ani falownikiem.<div class="demo-controls"><label>Motyw <select id="preview-theme-mode"><option value="light">Jasny</option><option value="dark">Ciemny</option></select></label><label>Przykładowy układ <select id="preview-topology"><option value="load_only">LOAD</option><option value="load_with_external_ct">LOAD i CT</option></select></label><label>Przykład stref <select id="preview-schedule"><option value="g13">TAURON G13 — przykład zimowy</option><option value="g12">Inny operator — dwa tanie okna</option><option value="all_day">Jedna strefa całodobowa</option><option value="seven">Siedem przedziałów w dobie</option></select></label><label>Jakość planu <select id="preview-quality"><option value="forecast">Pełna prognoza</option><option value="fallback">Cel zachowawczy</option><option value="unavailable">Brak wyliczenia</option></select></label></div></div>
<deye-ems-panel-2-1-1 id="preview"></deye-ems-panel-2-1-1>
<script src="../custom_components/deye_ems/frontend/deye-ems-panel.js"></script>
<script>
  // Deliberately generic samples: no household history, credentials or API.
  const start=Math.floor(Date.now()/1800000)*1800000;
  const night=new Date();night.setHours(7,0,0,0);if(night.getTime()<=Date.now())night.setDate(night.getDate()+1);
  const peak=new Date();peak.setHours(16,0,0,0);if(peak.getTime()<=Date.now())peak.setDate(peak.getDate()+1);
  const deadline=night.toISOString();
  const example={entry_id:"preview-entry",backend_version:"2.1.1",updates:{status:"not_checked",latest_version:null,checked_at:null,retry_at:null,reason:null,release_url:null,marketplace_url:"/marketplace"},appearance:{theme:"synthetic-neutral"},mode:"shadow",loads_revision:"demo-1",effective_loads:[{id:"demo-pump",name:"Pompa ciepła (przykład)",energy_entity:"sensor.demo_pump_energy",power_entity:"",included_in_load:true}],options:{min_soc_percent:50,capacity_kwh:66,
    grid_import_limit_kw:12,grid_phase_limit_kw:5,inverter_max_power_kw:12,reserve_margin_soc_percent:5,
    winter_weather_soc_percent:75,topology:"load_only",
    discharge_max_kw:10,grid_max_soc_percent:95,
    extra_loads:[]},sources:{},data:{
    solcast:{status:"ok",api_configured:true,api_enabled:true,quota:{utc:{day:new Date().toISOString().slice(0,10),used:3},limit:10}},
    updated_at:new Date().toISOString(),inputs:{soc:64,soc_valid:true,topology:"load_only",inverter_work_mode:"Zero Export To Load",raw_load_power:2800,
      telemetry_valid:true,bms_valid:true,bms_cap_a:180,grid_charge_limit_valid:true,deye_max_charge_current_a:200,deye_grid_charge_limit_a:190,grid_port_power:4600,grid_power:4600,load_power:2800,
      total_load_with_outside_w:2800,outside_load_w:0,battery_power:-1200,current_a:26},
    control:{next_a:28,cap_a:42,read_setting_a:26,grid_charge_enabled:false,current_hold_reason:"scheduled_regular",next_current_change_at:new Date(start+1800000).toISOString(),recovery_remaining_s:0,initial_window_started:true,target_soc:75,pv_surplus_credit_w:0,net_grid_need_w:1484,
      target_deadline:deadline,target_source:"dated_cache",reason:"ramp_up"},
    plan:{status:"ok",quality:"valid",generated_at:new Date().toISOString(),
      targets:{night:{soc_percent:75,deadline},peak:{soc_percent:70,deadline:peak.toISOString()}},
      rows:Array.from({length:96},(_,i)=>({timestamp:new Date(start+i*1800000).toISOString(),
        soc_percent:Math.min(96,Math.max(50,64+13*Math.sin(i/11))),
        pv_kw:Math.max(0,5*Math.sin((i%48-12)/12)),load_kw:2.8,
        grid_import_kw:i<16?1.8:0}))}}};
  const previewOperators=[{operator_id:"tauron_dystrybucja",label:"TAURON Dystrybucja"},{operator_id:"pge_dystrybucja",label:"PGE Dystrybucja"},{operator_id:"enea_operator",label:"Enea Operator"},{operator_id:"energa_operator",label:"Energa Operator"},{operator_id:"pge_energetyka_kolejowa",label:"PGE Energetyka Kolejowa"}];
  const previewCatalog={backend_version:"2.1.1",operators:previewOperators,profiles:previewOperators.map(row=>({profile_id:"demo_"+row.operator_id,operator_id:row.operator_id,label:row.label+" — profil syntetyczny",tariff:"G13 — przykład",supported:true,runtime_allowed:true}))};
  function applyPreviewScenario(kind="g13",quality="forecast",refresh=true){
    const schedules={g13:{bounds:[0,7,13,16,21,24],cheap:[true,false,true,false,true],tariff:"G13 — przykład zimowy",operator:"TAURON Dystrybucja — dane syntetyczne"},
      g12:{bounds:[0,6,13,15,22,24],cheap:[true,false,true,false,true],tariff:"Dwa tanie okna — przykład",operator:"Inny operator — dane syntetyczne"},
      all_day:{bounds:[0,24],cheap:[true],tariff:"Strefa całodobowa — przykład",operator:"Przykładowy operator"},
      seven:{bounds:[0,5,8,10,13,16,19,24],cheap:[true,false,true,false,true,false,true],tariff:"Siedem przedziałów — przykład",operator:"Przykładowy operator"}};
    const schedule=schedules[kind]||schedules.g13,intervals=[],days=[];
    const localDate=new Intl.DateTimeFormat("sv-SE",{timeZone:"Europe/Warsaw",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date()).split("-").map(Number);
    function wallTime(day,hour){
      const desired=Date.UTC(localDate[0],localDate[1]-1,localDate[2]+day,hour),format=new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/Warsaw",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hourCycle:"h23"});
      let candidate=desired;
      for(let i=0;i<2;i++){
        const p=Object.fromEntries(format.formatToParts(new Date(candidate)).map(row=>[row.type,row.value]));
        candidate+=desired-Date.UTC(Number(p.year),Number(p.month)-1,Number(p.day),Number(p.hour),Number(p.minute),Number(p.second));
      }
      return new Date(candidate);
    }
    for(let day=0;day<2;day++){
      const weekday=new Intl.DateTimeFormat("en-US",{timeZone:"Europe/Warsaw",weekday:"short"}).format(wallTime(day,0));
      const freeDay=kind==="g13"&&["Sat","Sun"].includes(weekday);
      const bounds=freeDay?[0,24]:schedule.bounds,cheapFlags=freeDay?[true]:schedule.cheap,dayRows=[];
      for(let index=0;index<cheapFlags.length;index++){
        const from=wallTime(day,bounds[index]),to=wallTime(day,bounds[index+1]),cheap=cheapFlags[index];
        dayRows.push({start:from.toISOString(),end:to.toISOString(),zone:cheapFlags.length===1?"flat":cheap?"off_peak":"peak",tier:cheap?0:2,grid_charge_allowed:cheap,reason:freeDay?"weekend":"weekday"});
      }
      days.push(dayRows);intervals.push(...dayRows);
    }
    example.options.tariff_calendar={profile_id:"demo_"+kind,operator_id:"tauron_dystrybucja",operator_label:schedule.operator,tariff:schedule.tariff,label:"Profil demonstracyjny",version:"demo",clock_basis:"local",runtime_allowed:true,preview_only:false,current_zone:intervals.find(row=>Date.parse(row.start)<=Date.now()&&Date.parse(row.end)>Date.now())?.zone,next_change:intervals.find(row=>Date.parse(row.end)>Date.now())?.end,today:days[0],tomorrow:days[1]};
    example.data.plan.tariff_slot_targets=intervals.map(row=>{
      const past=Date.parse(row.end)<=Date.now(),known=quality!=="unavailable";
      return {...row,charge_target_soc_percent:row.tier===0&&known?75:null,reserve_soc_percent:50,
        projected_soc_start_percent:quality==="forecast"?64:null,projected_soc_end_percent:quality==="forecast"?(row.tier===0?75:58):null,
        projection_from:quality==="forecast"?new Date(Math.max(Date.now(),Date.parse(row.start))).toISOString():null,
        deadline:kind==="all_day"?deadline:row.end,quality:past?"past":quality};
    });
    example.data.plan.quality=quality==="forecast"?"valid":"invalid";
    example.data.plan.rows=quality==="forecast"?example.data.plan.rows:[];
    if(refresh)previewPanel.refresh();
  }
  example.post_save_activation={status:"idle",reason:null,issues:[],updated_at:null};
  const previewForecastRows=structuredClone(example.data.plan.rows);
  applyPreviewScenario("g13","forecast",false);
  let previewActivationTimer=null;
  function previewActivateAfterSave(){
    clearTimeout(previewActivationTimer);example.post_save_activation={status:"waiting",reason:"waiting_for_measurements",issues:[],updated_at:new Date().toISOString()};
    previewActivationTimer=setTimeout(()=>{example.mode="active";example.post_save_activation={status:"active",reason:"activation_completed",issues:[],updated_at:new Date().toISOString()};previewPanel.refresh();},1500);
  }
  let revision=1;
  const previewFlows=new Map();
  let previewFlowNumber=0,previewConfigured=false;
  const previewMenu=(flow)=>({type:"menu",flow_id:flow.id,step_id:flow.step,
    menu_options:flow.step==="init"?["parameters","solcast","sources","tariff"]:["solcast_manual","solcast_import","solcast_disable"]});
  function previewForm(flow,errors={}){
    if(flow.step==="tariff_operator")return {type:"form",flow_id:flow.id,step_id:flow.step,errors,data_schema:[{name:"operator_id",required:true,selector:{select:{options:previewOperators.map(row=>({value:row.operator_id,label:row.label}))}}}]};
    if(flow.step==="tariff_plan")return {type:"form",flow_id:flow.id,step_id:flow.step,errors,data_schema:[{name:"profile_id",required:true,selector:{select:{options:previewCatalog.profiles.filter(row=>row.operator_id===flow.operator).map(row=>({value:row.profile_id,label:row.label}))}}},{name:"clock_basis",required:true,selector:{select:{options:[{value:"local",label:"Czas lokalny — lato/zima"},{value:"fixed_cet",label:"Stały CET"}]}}}]};
    if(flow.step==="tariff_confirm")return {type:"form",flow_id:flow.id,step_id:flow.step,errors,description_placeholders:{tariff_preview:"Podgląd demonstracyjny, dane syntetyczne. Operator: "+flow.operator+". Zegar: "+flow.clock+". W prawdziwej integracji silnik pobiera reguły z katalogu operatora; ten ekran nie potwierdza rzeczywistej taryfy."},data_schema:[{name:"confirm_tariff",required:true,default:false,selector:{boolean:{}}}]};

    if(flow.step==="solcast_import")return {type:"form",flow_id:flow.id,step_id:flow.step,errors,
      data_schema:[{name:"source_entry",required:true,selector:{select:{options:[
        {value:"preview-solcast",label:"Solcast — syntetyczne źródło z kalibracją"}]}}}]};
    const schema=[
      {name:"api_key",selector:{text:{type:"password"}}},
      {name:"resource_ids",default:"demo-roof",selector:{text:{}}},
      {name:"poll_interval_minutes",required:true,default:360,selector:{number:{min:15,max:1440,step:1}}},
      {name:"max_requests_per_day",required:true,default:10,selector:{number:{min:1,max:1000,step:1}}},
      {name:"initial_requests_used",required:true,default:10,selector:{number:{min:0,max:1000,step:1}}},
      {name:"dampening_factor",required:true,default:1,selector:{number:{min:0,max:2,step:0.01}}},
      {name:"hourly_factors",default:"1 ".repeat(23)+"1",selector:{text:{}}}
    ];
    if(flow.imported)schema.push({name:"accept_manual_calibration",required:true,default:false,selector:{boolean:{}}});
    return {type:"form",flow_id:flow.id,step_id:"solcast_manual",data_schema:schema,errors,
      description_placeholders:{import_note:flow.imported?
        "Bieżące współczynniki zostały odczytane i skopiowane. To stan kalibracji, bez dalszego samouczenia. Dane podglądu są wyłącznie syntetyczne.":
        "Podgląd: możesz wpisać dowolny syntetyczny klucz o długości co najmniej 8 znaków. Nie wpisuj prawdziwego klucza."}};
  }
  const previewHass={themes:{theme:"default",darkMode:false,themes:{
    "synthetic-neutral":{
      "primary-color":"#526b7d","ha-card-background":"var(--card-background-color)",
      "ha-card-border-radius":"18px","ha-card-border-width":"1px","ha-card-box-shadow":"none",
      "lovelace-background":"var(--primary-background-color)",
      "ha-color-primary-90":"#dce6ed","ha-color-primary-80":"#c6d7e2","ha-color-primary-40":"#34596e",
      "ha-color-primary-10":"#1c303d","ha-color-primary-20":"#2b4555","ha-color-primary-60":"#a9c4d5",
      modes:{light:{"primary-background-color":"#eef1f3","secondary-background-color":"#e1e8ed",
        "card-background-color":"#ffffff","primary-text-color":"#24323b","secondary-text-color":"#536773","divider-color":"#d1dce3"},
        dark:{"primary-background-color":"#172127","secondary-background-color":"#24343d",
          "card-background-color":"#25333b","primary-text-color":"#edf3f6","secondary-text-color":"#b6c8d2","divider-color":"#405660"}}
    }
  }},selectedTheme:{dark:false},states:{
    "sensor.demo_pump_energy":{state:"123",attributes:{friendly_name:"Pompa ciepła — energia",unit_of_measurement:"kWh"}},
    "sensor.demo_cwu_energy":{state:"456",attributes:{friendly_name:"CWU — energia",unit_of_measurement:"kWh"}},
    "sensor.demo_cwu_power":{state:"500",attributes:{friendly_name:"CWU — moc",unit_of_measurement:"W"}}
  },async callApi(method,route,data){
    if(method==="POST"&&route==="config/config_entries/options/flow"){
      const flow={id:"preview-flow-"+(++previewFlowNumber),step:"init",imported:false};
      previewFlows.set(flow.id,flow);return previewMenu(flow);
    }
    const id=decodeURIComponent(route.split("/").at(-1)),flow=previewFlows.get(id);
    if(method==="DELETE"){previewFlows.delete(id);return {message:"Flow aborted"};}
    if(!flow)throw Error("Synthetic flow not found");
    if(example.mode==="active"){previewFlows.delete(id);return {type:"abort",reason:"stop_before_mapping"};}
    if(method==="GET")return flow.step==="init"||flow.step==="solcast"?previewMenu(flow):previewForm(flow);
    if(data.next_step_id){
      flow.step=data.next_step_id==="tariff"?"tariff_operator":data.next_step_id;
      if(flow.step==="solcast")return previewMenu(flow);
      if(flow.step!=="solcast_disable")return previewForm(flow);
      example.data.solcast.status="disabled";
    }else if(flow.step==="tariff_operator"){
      if(!previewOperators.some(row=>row.operator_id===data.operator_id))return previewForm(flow,{base:"invalid_tariff_operator"});
      flow.operator=data.operator_id;flow.step="tariff_plan";return previewForm(flow);
    }else if(flow.step==="tariff_plan"){
      if(!previewCatalog.profiles.some(row=>row.profile_id===data.profile_id&&row.operator_id===flow.operator)||!["local","fixed_cet"].includes(data.clock_basis))return previewForm(flow,{base:"invalid_tariff_profile"});
      flow.profile=data.profile_id;flow.clock=data.clock_basis;flow.step="tariff_confirm";return previewForm(flow);
    }else if(flow.step==="tariff_confirm"){
      if(data.confirm_tariff!==true)return previewForm(flow,{base:"confirm_tariff_required"});
      example.options.tariff_calendar={...example.options.tariff_calendar,profile_id:flow.profile,operator_id:flow.operator,operator_label:previewOperators.find(row=>row.operator_id===flow.operator).label+" — podgląd syntetyczny",clock_basis:flow.clock};
    }else if(flow.step==="solcast_import"){
      flow.imported=true;flow.step="solcast_manual";return previewForm(flow);
    }else{
      if(flow.imported&&!data.accept_manual_calibration)return previewForm(flow,{base:"import_calibration_required"});
      if(!flow.imported&&!previewConfigured&&(!data.api_key||data.api_key.length<8))return previewForm(flow,{base:"invalid_solcast"});
      const hourly=String(data.hourly_factors||"").trim();
      if(hourly){
        const factors=hourly.replaceAll(";", " ").replaceAll(",", " ").split(/\s+/).map(Number);
        if(factors.length!==24||factors.some(value=>!Number.isFinite(value)||value<0||value>2))return previewForm(flow,{base:"invalid_solcast"});
      }
      previewConfigured=true;example.data.solcast.status="cached";
      example.data.solcast.quota={utc:{used:data.initial_requests_used},limit:data.max_requests_per_day};
    }
    previewFlows.delete(id);
    example.data.updated_at=new Date().toISOString();example.data.plan.generated_at=new Date().toISOString();
    previewActivateAfterSave();return {type:"create_entry",flow_id:id};
  },async callWS(message){
    if(message.type==="deye_ems/tariff_catalog")return structuredClone(previewCatalog);
    if(message.command==="check_updates")example.updates={status:"current",latest_version:"2.1.1",checked_at:new Date().toISOString(),retry_at:new Date(Date.now()+60000).toISOString(),reason:null,release_url:"https://github.com/gaszu/deye-ems/releases/tag/v2.1.1",marketplace_url:"/marketplace",stale:false};
    if(message.command==="appearance")example.appearance={theme:message.theme};
    if(["load_save","load_delete","load_toggle"].includes(message.command)){
      if(example.mode==="active")throw Error("Przejdź do obserwacji przed zmianą odbiorników.");
      if(message.expected_loads_revision!==example.loads_revision)throw Error("Lista odbiorników uległa zmianie.");
      const index=example.effective_loads.findIndex(load=>load.energy_entity===message.original_energy_entity);
      if(message.command==="load_toggle")example.effective_loads[index].enabled=message.enabled;
      else if(message.command==="load_delete")example.effective_loads.splice(index,1);
      else if(index>=0)example.effective_loads[index]={...example.effective_loads[index],...message.channel};
      else example.effective_loads.push({...message.channel,id:"demo-new-"+revision});
      example.loads_revision="demo-"+(++revision);
    }
    if(message.command==="mode"){
      example.mode=message.mode;
      if(message.mode==="shadow"&&["waiting","checking"].includes(example.post_save_activation.status)){clearTimeout(previewActivationTimer);example.post_save_activation={status:"cancelled",reason:"activation_cancelled",issues:[],updated_at:new Date().toISOString()};}
    }
    if(message.command==="option")example.options[message.key]=message.value;
    example.data.updated_at=new Date().toISOString();
    example.data.control.target_soc=Math.max(75,example.options.min_soc_percent);
    return structuredClone(example);
  }};
  const previewPanel=document.getElementById("preview");
  previewPanel.hass=previewHass;
  function updatePreviewScenario(){
    example.data.plan.rows=structuredClone(previewForecastRows);
    applyPreviewScenario(document.getElementById("preview-schedule").value,document.getElementById("preview-quality").value);
  }
  document.getElementById("preview-schedule").addEventListener("change",updatePreviewScenario);
  document.getElementById("preview-quality").addEventListener("change",updatePreviewScenario);
  document.getElementById("preview-topology").addEventListener("change",event=>{
    const ct=event.target.value==="load_with_external_ct";
    example.options.topology=event.target.value;
    Object.assign(example.data.inputs,{topology:event.target.value,
      inverter_work_mode:ct?"Zero Export To CT":"Zero Export To Load",
      outside_power_valid:true,outside_load_w:ct?2000:0,raw_load_power:2800,
      grid_port_power:ct?-2000:4600,grid_power:ct?0:4600,
      load_power:ct?4800:2800,total_load_with_outside_w:ct?4800:2800});
    previewPanel.refresh();
  });
  document.getElementById("preview-theme-mode").addEventListener("change",event=>{
    const dark=event.target.value==="dark";
    previewHass.themes={...previewHass.themes,darkMode:dark};
    previewHass.selectedTheme={dark};
    const profile=dark?{"primary-background-color":"#111111","secondary-background-color":"#282828",
      "card-background-color":"#1c1c1c","primary-text-color":"#e1e1e1","secondary-text-color":"#b5b5b5","divider-color":"#404040"}:
      {"primary-background-color":"#fafafa","secondary-background-color":"#e5e5e5",
        "card-background-color":"#ffffff","primary-text-color":"#212121","secondary-text-color":"#727272","divider-color":"#e0e0e0"};
    for(const [key,value] of Object.entries(profile))document.documentElement.style.setProperty("--"+key,value);
    document.documentElement.style.colorScheme=dark?"dark":"light";
    previewPanel.hass={...previewHass};
  });
</script>
</html>
